name: Docker release context
on:
  push:
    paths: ['cloud_deployment/**', 'backend/tests/test_context_repair.py', '.github/workflows/docker-context.yml']
  pull_request:
    paths: ['cloud_deployment/**', 'backend/tests/test_context_repair.py', '.github/workflows/docker-context.yml']
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install pytest
      - run: npm install --prefix cloud_deployment/dist/dockerignore-check --no-save --no-package-lock @balena/dockerignore@1.0.2
      - run: python -m pytest backend/tests/test_context_repair.py -v
