name: Local GeneScope client
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['genescope.py', 'start_local.*', 'local_runtime/**', 'requirements-local.lock.txt', 'scripts/build_local_bundle.py', 'backend/**', 'frontend/**', '.github/workflows/local-client.yml', 'VERSION']
  pull_request:
    paths: ['genescope.py', 'start_local.*', 'local_runtime/**', 'requirements-local.lock.txt', 'scripts/build_local_bundle.py', 'backend/**', 'frontend/**', '.github/workflows/local-client.yml', 'VERSION']
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14.0'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: 'npm', cache-dependency-path: 'frontend/package-lock.json'}
      - run: python -m pip install -r requirements-local.lock.txt pytest==9.2.0 httpx==0.28.1
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pytest -q backend/tests/test_local_runtime.py backend/tests/test_frontend_update.py
        env:
          PYTHONUTF8: '1'
      - run: python scripts/build_local_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: GeneScope-local-${{ runner.os }}
          path: local_dist/*.zip*
          if-no-files-found: error
