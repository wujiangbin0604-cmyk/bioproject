name: genescope2
services:
  web:
    build:
      context: .
      dockerfile: cloud_deployment/Dockerfile.genescope2
    image: genescope:2.0.0
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      GENESCOPE_LAB_TRAINING_ENABLED: "1"
      GENESCOPE_ALLOWED_ORIGINS: "http://127.0.0.1:18080,http://localhost:18080,https://47.243.232.201"
      GENESCOPE_LAB_MEMORY_MB: "1024"
      GENESCOPE_LAB_MIN_AVAILABLE_MB: "512"
      GENESCOPE_LAB_TIMEOUT: "900"
      GENESCOPE_LAB_DEVELOPMENT_DIR: "/app/development_data"
    volumes:
      - /opt/genescope/state-v2/datasets:/app/datasets
      - /opt/genescope/state-v2/experiment_runs:/app/experiment_runs
      - /opt/genescope/state-v2/model_registry:/app/model_registry
      - /opt/genescope/state-v2/legacy_tasks:/app/results/lab_experiments
      - /opt/genescope/state-v2/development_data:/app/development_data:ro
    mem_limit: 1536m
    cpus: 1.25
    pids_limit: 160
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}
