name: genescope-preview
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: genescope:hk-preview-v3
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GENESCOPE_LAB_TRAINING_ENABLED: "0"
      GENESCOPE_ALLOWED_ORIGINS: "http://127.0.0.1:8080,http://localhost:8080"
    mem_limit: 1024m
    cpus: 1.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=192m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 25s
